name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack sources
        run: |
          if [ -f grit-src.zip ]; then rm -rf src; unzip -o grit-src.zip; fi  
          ls -R src | head -40
          test -f src/main/resources/fabric.mod.json || { echo "::error::Нет src/main/resources/fabric.mod.json"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build
        run: gradle build --no-daemon
      - name: Check jar
        run: |
          unzip -l build/libs/grit-1.0.0.jar
          unzip -l build/libs/grit-1.0.0.jar | grep -q fabric.mod.json || { echo "::error::В jar нет fabric.mod.json"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: grit-mod
          path: build/libs/grit-1.0.0.jar
